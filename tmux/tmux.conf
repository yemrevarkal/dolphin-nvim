set-option -sa terminal-overrides ",xterm*:Tc"

## extended keys: forward Shift/Ctrl/Alt+Enter (and other CSI-u keys) through to
## apps like Neovim, so <S-CR>/<C-CR>/<M-CR> are distinguishable from plain <CR>.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'alacritty:extkeys'
set -as terminal-features 'xterm-kitty:extkeys'

## let the Kitty graphics protocol through tmux, so inline notebook images /
## plots (jupynvim's placeholder renderer) actually render. jupynvim wraps the
## escapes as `ESC P tmux; ... ESC \`, but tmux only forwards them with this on.
set -g allow-passthrough on

set -g default-command "${SHELL} -l"
set -g mode-keys vi

## forward terminal focus events to apps, so Neovim's FocusGained fires when you
## switch back to its pane — lets jupynvim auto-detect agent edits to .ipynb
## files (checktime on focus) without a manual :e!.
set -g focus-events on
set -g mouse on 


## unbinding C-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


## vim selections
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# window numbering from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


## bind the newly open path to current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

## 
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"


## plugins 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'


run '~/.tmux/plugins/tpm/tpm'
