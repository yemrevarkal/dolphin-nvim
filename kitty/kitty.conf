# Ported from alacritty/alacritty.toml — GNOME Tango scheme.

# ── Font ─────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        13.0

# ── Window ───────────────────────────────────────────────────────────
window_padding_width  12
background_opacity     1.0
# NOTE: alacritty's `draw_bold_text_with_bright_colors = true` has no kitty
# equivalent — kitty renders bold text with the bold font weight instead of
# the bright palette. This is intentional upstream; nothing to set here.

# ── Keyboard ─────────────────────────────────────────────────────────
# kitty implements the kitty keyboard protocol natively, so Neovim 0.10+
# can already distinguish <S-CR>/<C-CR> from plain <CR> without help.
# These maps replicate the exact CSI-u escapes alacritty sent, so the
# notebook "run cell" mappings keep working identically.
map shift+enter   send_text all \x1b[13;2u
map ctrl+enter    send_text all \x1b[13;5u
map ctrl+m        send_text all \x1b\x1b

# ── Colors: primary ──────────────────────────────────────────────────
background  #212020
foreground  #FCFCFC

# ── Colors: normal ───────────────────────────────────────────────────
color0  #2E3436
color1  #CC0000
color2  #4E9A06
color3  #C4A000
color4  #3465A4
color5  #75507B
color6  #06989A
color7  #D3D7CF

# ── Colors: bright ───────────────────────────────────────────────────
color8   #555753
color9   #EF2929
color10  #8AE234
color11  #FCE94F
color12  #729FCF
color13  #AD7FA8
color14  #34E2E2
color15  #EEEEEC
